
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body, canvas {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.16;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(255, 20, 50, 0.20) 4px
    );
    animation: scan 8s linear infinite;
}

#glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(80, 0, 12, 0.16) 100%
    );
}

@keyframes scan {
    from { transform: translateY(-12px); }
    to   { transform: translateY(12px); }
}

@media (prefers-reduced-motion: reduce) {
    #scanlines { animation: none; }
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="scanlines"></div>
<div id="glow"></div>

<script>
(() => {
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");

    if (!ctx) return;

    let w = 0, h = 0, dpr = 1;
    let columns = 0;
    let drops = [];
    let particles = [];

    const chars = "01アイウエオ<>/{}[]#$%SYSTEM_SCAN";
    const fontSize = 15;
    const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        w = window.innerWidth;
        h = window.innerHeight;

        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        columns = Math.ceil(w / fontSize);
        drops = Array.from(
            { length: columns },
            () => Math.random() * (h / fontSize)
        );

        const count = Math.min(65, Math.floor(w * h / 22000));
        particles = Array.from({ length: count }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 0.6 + Math.random() * 1.8,
            speed: 0.15 + Math.random() * 0.55,
            alpha: 0.15 + Math.random() * 0.5
        }));
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);

        // Faint code rain; the image and dashboard remain visible.
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const ch = chars[Math.floor(Math.random() * chars.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;

            ctx.fillStyle = Math.random() > 0.96
                ? "rgba(255,65,85,0.55)"
                : "rgba(220,25,50,0.19)";

            ctx.fillText(ch, x, y);

            if (y > h && Math.random() > 0.975) {
                drops[i] = 0;
            } else {
                drops[i] += 0.28 + Math.random() * 0.3;
            }
        }

        // Slowly drifting red particles.
        for (const p of particles) {
            p.y -= p.speed;
            p.x += Math.sin(p.y * 0.008) * 0.22;

            if (p.y < -5) {
                p.y = h + 5;
                p.x = Math.random() * w;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,35,60,${p.alpha})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ff1838";
            ctx.fill();
        }

        ctx.shadowBlur = 0;

        if (!reducedMotion) {
            requestAnimationFrame(draw);
        }
    }

    window.addEventListener("resize", resize);
    resize();
    draw();
})();
</script>
</body>
</html>
