[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-red-teaming-agent"
version = "0.1.0"
description = "An AI red teaming platform for authorized adversarial testing and security regression testing."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Jaseell" }
]

[tool.setuptools.packages.find]
where = ["src"]
