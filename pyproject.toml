[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-red-teaming-agent"
version = "0.1.0"
description = "An AI red teaming platform for authorized adversarial testing and security regression testing."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Jaseell" }
]

dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
